{% extends "base.html" %}

{% block title %}Trả lời câu hỏi{% endblock %}

{% block content %}
<h2>📝 Trả lời câu hỏi</h2>
<p><b>{{ question.user.username }}</b> hỏi:</p>
<blockquote class="blockquote">{{ question.question }}</blockquote>

<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label for="answer" class="form-label">Câu trả lời</label>
    <textarea name="answer" id="answer" class="form-control" rows="4"></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Gửi trả lời</button>
  <a href="{% url 'unanswered_questions' %}" class="btn btn-secondary">Hủy</a>
</form>
{% endblock %}
