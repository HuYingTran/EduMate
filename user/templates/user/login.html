{% extends "base.html" %}
{% block content %}
<h2>Đăng nhập</h2>

<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <p>
        <label for="id_username">Email:</label>
        {{ form.username }}
    </p>
    <p>
        <label for="id_password">Mật khẩu:</label>
        {{ form.password }}
    </p>
    <button type="submit">Đăng nhập</button>
</form>
{% endblock %}
