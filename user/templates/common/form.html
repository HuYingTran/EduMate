{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm p-4">
    <h2 class="mb-4 text-primary">{{ object_type }}</h2>

    <form method="post" class="row g-3">
        {% csrf_token %}

        <!-- Loop qua các field -->
        {% for field in form %}
        <div class="col-md-6">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger mt-1 small">
                {{ field.errors }}
            </div>
            {% endif %}
        </div>
        {% endfor %}

        <!-- Buttons -->
        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary me-2">💾 Lưu</button>
            <a href="{% url object_prefix|add:'_list' %}" class="btn btn-outline-secondary">⬅️ Quay lại</a>
        </div>
    </form>
</div>
{% endblock %}
