{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Phản hồi phản ánh: {{ reflect.title }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-2">Gửi phản hồi</button>
    </form>
</div>
{% endblock %}
