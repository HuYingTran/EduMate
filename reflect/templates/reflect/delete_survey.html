{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Xóa khảo sát: {{ survey.title }}</h2>
    <p>Bạn có chắc muốn xóa khảo sát này không?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Xóa</button>
        <a href="{% url 'surveys_view' %}" class="btn btn-secondary ms-2">Hủy</a>
    </form>
</div>
{% endblock %}
