{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Tạo phản ánh mới</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success mt-2">Gửi phản ánh</button>
    </form>
</div>
{% endblock %}
