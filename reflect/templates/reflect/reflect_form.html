{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Tạo phản ánh mới</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <!-- Preview ảnh -->
        <div class="mt-2">
            <img id="attachment-preview" src="#" alt="Preview" style="display:none; max-width: 300px; max-height: 300px; border:1px solid #ccc; padding:5px;">
        </div>

        <button type="submit" class="btn btn-success mt-2">Gửi phản ánh</button>
    </form>
</div>

<!-- JS để hiển thị preview nếu file là ảnh -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const attachmentInput = document.querySelector('input[name="attachment"]');
    const preview = document.getElementById('attachment-preview');

    if (attachmentInput) {
        attachmentInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const fileType = file.type;
                if (fileType.startsWith('image/')) {  // Chỉ hiển thị ảnh
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                } else {
                    preview.src = "#";
                    preview.style.display = 'none';
                }
            } else {
                preview.src = "#";
                preview.style.display = 'none';
            }
        });
    }
});
</script>
{% endblock %}
