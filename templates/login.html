{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Đăng nhập</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
      {{ form.username.label_tag }}  
      {{ form.username }}
    </div>
    <div class="mb-3">
      {{ form.password.label_tag }}  
      {{ form.password }}
    </div>
    <button type="submit" class="btn btn-primary">Đăng nhập</button>
  </form>
</div>
{% endblock %}
